<!DOCTYPE html>
<html>
    <head>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <img src="favicon.ico">
            <p>Big Screen Launcher</p>
            <p style="font-size: 13px;">v26.0</p>
        </header>

        <div class="main-content">

            <nav>
                <button id="library-button"><img class="rail-button-icon" src="svg/library.svg"></button>
                <button id="downloads-button"><img class="rail-button-icon" src="svg/download.svg"></button>
                <button id="settings-button"><img class="rail-button-icon" src="svg/gear.svg"></button>
                <button id="player-button"><img class="rail-button-icon" src="svg/disc.svg"></button>
            </nav>

            <div style="width: 100%; margin: 0px 12px; position: relative;">

                <div class="top-area-image">

                    <div class="hero-image">
                        <img class="logo-image" src="images/logo.png" alt="Game Title">
                    </div>

                </div>

                <div id="button-container">
                    <button class="play-button">▶ Start</button>
                </div>

                <div class="options-partition">
                    <div class="game-options-divider"></div>
                    <button class="game-options-button"><img src="svg/heart.svg"></button>
                    <button class="game-options-button"><img src="svg/gear.svg"></button>
                    <button class="game-options-button"><img src="svg/remove.svg"></button>
                </div>

            </div>

        </div>

    </body>
</html>

<script src="script.js"></script>
<script src="javascript/game.js"></script>
