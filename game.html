<!DOCTYPE html>
<html>
    <head>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <img src="favicon.ico">
            <p>Big Screen Launcher</p>
            <p id="version-number" style="font-size: 13px;">v26.0</p>
        </header>

        <div id="deletion-prompt-cover" style="display: none;">
            <div id="deletion-prompt-window"> 
                <h2>Are you sure?</h2>
                <p id="deletion-prompt-text">Removing the game from your library will not delete the game files.</p> 
                <div style="display: flex; flex-direction: row; gap: 10px;">
                    <button id="deletion-prompt-no" class="normal-button">nah, nevermind</button>
                    <button id="deletion-prompt-yes" class="preferable-button">yeah, it sucked anyway</button>
                </div>
            </div>
        </div>

        <div id="options-cover" style="display: none;">
            <div id="options-window"> 
                <h2>Options</h2>
                <p id="options-text">Edit the options and metadata of this game.</p> 
                
            </div>
        </div>

        <div id="versions-cover" style="display: block;">
            <div id="versions-window"> 
                <h2>Versions</h2>
                <p id="versions-text">Download a version.</p> 
                
            </div>
        </div>

        <div class="main-content">

            <nav>
                <button id="library-button"><img class="rail-button-icon" src="svg/library.svg"></button>
                <button id="downloads-button"><img class="rail-button-icon" src="svg/download.svg"></button>
                <button id="settings-button"><img class="rail-button-icon" src="svg/gear.svg"></button>
                <button id="player-button"><img class="rail-button-icon" src="svg/disc.svg"></button>
            </nav>

            <div style="width: 100%; margin: 0px 12px; position: relative;">

                <div class="top-area-image">

                    <div class="hero-image">
                        <img class="logo-image">
                    </div>

                </div>

                <div id="button-container">
                    <button id="play-button" class="play-button">▶ Start</button>
                </div>

                <div id="dropdown-menu" class="mc-dropdown">
                    <!-- content -->
                    <button class="minecraft-dropdown-item">
                        <img src="images/Minecraft.png">
                        <div style="display: flex; justify-content: left; flex-direction: column;">
                            <p style="margin: 0; text-align: left;">Minecraft 26.2.2</p>
                            <p style="margin: 0; text-align: left; color: #aaa;">26.2.2 — Fabric</p>
                        </div>
                    </button>

                    <button class="minecraft-dropdown-item">
                        <p style="width: 100%; text-align: center;">+ Add Installation</p>
                    </button>
                </div>

                <div class="options-partition">
                    <div id="dropdown" class="minecraft-version-divider" style="/*display: none;*/">
                        <img src="images/Minecraft.png" style="height: 80%; margin-left: -5px; margin-right: 6px; border-radius: 3px;">
                        <p>Minecraft 26.2.1</p>
                        <svg id="dropdown-arrow" width="32" height="32" viewBox="0 0 24 24" focusable="false" style="fill: #FFF;"><path id="collapse-svg" d="M5.41 7.59L4 9l8 8 8-8-1.41-1.41L12 14.17"></path></svg>
                    </div>
                    <div class="game-options-divider"></div>
                    <button id="favorite-button" class="game-options-button"><img src="svg/heart.svg"></button>
                    <button id="options-button" class="game-options-button"><img src="svg/gear.svg"></button>
                    <button id="folder-button" class="game-options-button"><img src="svg/folder.svg"></button>
                    <button id="remove-button" class="game-options-button"><img src="svg/remove.svg"></button>
                </div>

            </div>

        </div>

    </body>
</html>

<script src="script.js"></script>
<script src="javascript/game.js"></script>
