<!DOCTYPE html>
<html>
    <head>
        <title>iPod</title>
        <link rel="stylesheet" href="stylesheets/ipod.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    </head>
    <body style="display: flex; align-content: center; justify-content: center; justify-items: center;">
        <div id="ipod">
            <img src="images/iPod-Frame.png" style="z-index: 5; width: 300px; -webkit-user-drag: none; -webkit-app-region: drag; pointer-events: none;">
            <div id="ipod-screen">
                <div style="width: 100%; border-bottom: 1.3px solid #757677;">
                    <div id="topbar">
                        <p id="ipod-time">9:42 AM</p>
                        <p id="ipod-artist">Taylor Swift</p>
                        <p id="ipod-title">The Fate of Ophelia</p>
                    </div>
                </div>

                <img id="miniplayer-img" src="images/The Fate of Ophelia cover.jpg">
                
                <div id="lyrics-container"></div>

                <div id="ipod-bottom-bar">
                    <p id="seek-time">1:00</p>
                    <div id="progress-bar"><div id="progress"></div> </div>
                    <p id="seek-remaining">-3:46</p>
                </div>
            </div>
        </div>
        <div style="position: absolute; transform: translate(-185px, -8px);">
            <button id="menu-button" tabindex="-1"></button>
            <button id="pause-button" tabindex="-1"></button>
            <button id="skip-button" tabindex="-1"></button>
            <button id="back-button" tabindex="-1"></button>
        </div>
    </body>
</html>

<script src="javascript/background-audio.js"></script>
<script>
    function updateClock() {
        const now = new Date();
        let hr = now.getHours();
        let min = now.getMinutes();
        let stamp = ' AM';
        if (now.getHours() > 12) {
            hr = now.getHours() - 12;
            stamp = ' PM';
        }
        if (now.getMinutes() < 10) {
            min = '0' + now.getMinutes();
        }
        document.getElementById('ipod-time').textContent = hr + ":" + min + stamp;
    }

    updateClock();
    setInterval(updateClock, 500);
</script>
