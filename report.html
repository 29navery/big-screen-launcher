<!DOCTYPE html>
<html>
    <head>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="stylesheets/report.css">
    </head>
    <body>
        <!-- name prompt -->
        <div id="name-prompt-cover" style="display: none;">
            <div id="name-prompt-window"> 
                <h2>Enter Game Name</h2>
                <p>Be as specific as possible or art may appear incorrect.</p> 
                <input id="name-input-text-field" type="text">
                <button id="name-input-create-button" class="normal-button">Add</button>
            </div>
        </div>
        
        <header>
            <img src="favicon.ico">
            <p>Big Screen Launcher</p>
            <p id="version-number" style="font-size: 13px;">v26.0</p>
        </header>

        <div class="main-content">
            <nav>
                <button id="library-button"><img class="rail-button-icon" src="svg/library.svg"></button>
                <button id="downloads-button"><img class="rail-button-icon" src="svg/download.svg"></button>
                <button id="settings-button"><img class="rail-button-icon" src="svg/gear.svg"></button>
                <button id="player-button"><img class="rail-button-icon" src="svg/disc.svg"></button>
                <button id="report-button" style="position: absolute; bottom: 15px; font-size: 24px;">📢</button>
            </nav>
            <div id="content">
                <h1>Report</h1>
                <p>* What part of the app are you reporting?</p>
                <select id="part-dropdown">
                    <option value=""></option>
                    <option value="library">The Library</option>
                    <option value="game">The Game Page</option>
                    <option value="downloads">The Downloads Page</option>
                    <option value="settings">The Settings Page</option>
                    <option value="music">The Music Page</option>
                    <option value="ipod">The iPod</option>
                    <option value="function">A general app function</option>
                    <option value="other">Something else...</option>
                </select>
                <input id="other-input" style="display: none;">
                <br>
                <p>* What's the issue you're encountering with it?</p>
                <textarea id="issue-description"></textarea>
                <p style="font-size: 11px; margin-top: 0;"><span id="char-counter">0</span>/5000</p>
                <button id="submit-button" class="preferable-button">Submit</button>
            </div>
        </div>
    </body>
</html>
