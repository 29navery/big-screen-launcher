<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading Big Screen Launcher</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #08111a;
        color: #f5f8fc;
        font-family:
          Inter,
          Segoe UI,
          Arial,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: grid;
        place-items: center;
      }
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, rgba(70, 194, 255, 0.22), transparent 34%),
          linear-gradient(135deg, #0e2535, #0a0f17 68%);
      }
      .panel {
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      .mark {
        width: 74px;
        height: 74px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 18px 52px rgba(0, 0, 0, 0.34);
      }
      .star {
        width: 34px;
        height: 34px;
        background: #46c2ff;
        clip-path: polygon(50% 0, 61% 34%, 96% 50%, 61% 66%, 50% 100%, 39% 66%, 4% 50%, 39% 34%);
        animation: pulse 1.1s ease-in-out infinite;
      }
      h1 {
        font-size: 1.05rem;
        line-height: 1;
        margin: 0;
        font-weight: 850;
        letter-spacing: 0;
        color: #f5f8fc;
      }
      p {
        margin: 0;
        color: #a9b7c7;
        font-size: 0.82rem;
        font-weight: 600;
      }
      .loader {
        width: 190px;
        height: 5px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
      }
      .loader span {
        display: block;
        width: 44%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #46c2ff, #63d471);
        animation: slide 1.15s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-105%);
        }
        50% {
          transform: translateX(85%);
        }
        100% {
          transform: translateX(235%);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.9);
          filter: drop-shadow(0 0 6px rgba(70, 194, 255, 0.34));
        }
        50% {
          transform: scale(1.08);
          filter: drop-shadow(0 0 18px rgba(70, 194, 255, 0.72));
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="panel">
        <div class="mark"><div class="star"></div></div>
        <h1>Big Screen Launcher</h1>
        <p>Starting up...</p>
        <div class="loader"><span></span></div>
      </div>
    </div>
  </body>
</html>
