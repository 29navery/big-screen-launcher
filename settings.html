<!DOCTYPE html>
<html>
    <head>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <img src="favicon.ico">
            <p>Big Screen Launcher</p>
            <p style="font-size: 13px;">v26.0</p>
        </header>
        <div class="main-content">
            <nav>
                <button id="library-button"><img class="rail-button-icon" src="svg/library.svg"></button>
                <button id="downloads-button"><img class="rail-button-icon" src="svg/download.svg"></button>
                <button id="settings-button"><img class="rail-button-icon" src="svg/gear.svg"></button>
                <button id="player-button"><img class="rail-button-icon" src="svg/disc.svg"></button>
            </nav>
            <div id="content" style="display: flex; flex-direction: column; gap: 20px;">
                <h1 style="text-indent:25px;">Settings</h1>
                <div id="update-prompt" style="display: none;" class="settings-section">
                    <h2>Update available!</h2>
                    <p id="update-version-text">Latest Version: . . .</p>
                    <button id="update-install-button" class="preferable-button">Install now</button>
                    <button class="normal-button">Changelog</button>
                </div>
                <div class="settings-section">
                    <h2>Themes</h2>
                    <p></p>
                    <div id="directory-list"></div>
                    <button class="preferable-button">Import Theme</button>
                </div>
                <div class="settings-section">
                    <h2>SteamGridDB</h2>
                    <div id="sgdb-content" class="section-content">
                        <p>API Key</p>
                        <input type="text" id="sgdb-api-key-input" style="height: 24px; border-radius: 8px;">
                        <button id="save-settings-btn" class="normal-button" style="padding: 0 60px;">Save Key</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h2>Big Screen Launcher</h2>
                    <div id="bsl-content" class="section-content">
                        <div style="display: flex; gap: 5px; flex-direction: row; justify-content: left; align-items: center;">
                            <input type="checkbox">
                            <p>Start with Windows</p>
                        </div>
                    </div>
                </div>
                <div class="settings-section">
                    <h2>Music Player</h2>
                    <div id="music-player-content" class="section-content">
                        <div style="display: flex; gap: 5px; flex-direction: row; justify-content: left; align-items: center;">
                            <input id="show-ipod-automatically" type="checkbox">
                            <p>Show iPod automatically</p>
                        </div>
                        <div style="display: flex; gap: 5px; flex-direction: row; justify-content: left; align-items: center;">
                            <input id="keep-ipod-front" type="checkbox">
                            <p>Keep iPod on top</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>

<script type="module" src="javascript/settings.js"></script>
<script src="script.js"></script>

<script>
    document.addEventListener('click', (event) => {
        const h2 = event.target.closest('h2');
        if (!h2) return;

        let targetDiv = h2.nextElementSibling;
        if (targetDiv && targetDiv.matches('#sgdb-content, #bsl-content, #music-player-content')) {
            if (targetDiv.style.display === 'none') {
                targetDiv.style.setProperty('display', 'block');
            } else {
                targetDiv.style.setProperty('display', 'none');
            }
        }
    });
</script>
